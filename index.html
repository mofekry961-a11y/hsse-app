<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نظام بصمة الوجه - HSSE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    body { background-color: #121212; color: white; font-family: system-ui, sans-serif; text-align: center; }
    #video-wrapper { position: relative; width: 100%; max-width: 480px; margin: 10px auto; border: 4px solid #0d6efd; border-radius: 15px; overflow: hidden; background: #000; height: 320px; }
    video { width: 100%; height: 100%; object-fit: cover; }
    canvas { position: absolute; top:0; left:0; width:100%; height:100%; }
    .status-msg { font-size: 1.1rem; font-weight: bold; padding: 12px; border-radius: 8px; margin: 10px auto; max-width: 480px; }
  </style>
</head>
<body>

<div class="container py-2">
  <h4 class="text-primary mt-2">📱 نظام البصمة الذكي - HSSE</h4>
  
  <div id="video-wrapper">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="statusBox" class="status-msg bg-warning text-dark">⏳ جاري فتح الكاميرا وتجهيز النظام...</div>

  <div class="card p-3 bg-dark text-white border-secondary mx-auto" style="max-width: 480px;">
    <div class="d-flex justify-content-around mb-3">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="mode" id="mT" value="Toolbox" checked onchange="changeMode()">
        <label class="form-check-label text-success fw-bold" for="mT">Toolbox</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="mode" id="mS" value="Specific" onchange="changeMode()">
        <label class="form-check-label text-primary fw-bold" for="mS">Specific</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="mode" id="mR" value="Register" onchange="changeMode()">
        <label class="form-check-label text-danger fw-bold" for="mR">تسجيل جديد 👤</label>
      </div>
    </div>

    <div id="topicDiv"><select id="topicSelect" class="form-select bg-dark text-white border-secondary"></select></div>

    <div id="registerDiv" class="d-none">
      <div class="input-group mb-2">
        <input type="number" id="workerId" class="form-control bg-dark text-white border-secondary" placeholder="أدخل ID العامل">
        <button class="btn btn-primary" onclick="verifyWorker()">تحقق</button>
      </div>
      <div id="workerNameLabel" class="text-info fw-bold mb-2"></div>
      <button id="saveFaceBtn" class="btn btn-danger w-100" onclick="saveNewFace()" disabled>📸 حفظ البصمة</button>
    </div>
  </div>
</div>

<script>
  // رابط الجوجل سكريبت الخاص بك
  const API_URL = "https://script.google.com/macros/s/AKfycbxJYmRmWrjdoR0XJjNcu6Q80QQn7A1c3oI8JnE2w0jz6a_u7G4YF8LGwVyAHk9RdrI3_w/exec";

  const video = document.getElementById('video');
  const canvas = document.getElementById('overlay');
  const statusBox = document.getElementById('statusBox');
  let modelsLoaded = false;
  let labeledDescriptors = [];
  let isProcessing = false;
  let currentVerifiedId = null;

  async function init() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      statusBox.innerText = "🎥 الكاميرا تعمل.. جاري تحميل محرك الذكاء الاصطناعي...";
      
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
      
      modelsLoaded = true;
      statusBox.className = "status-msg bg-success text-white";
      statusBox.innerText = "✅ النظام جاهز.. وجه الكاميرا لوش العامل!";
      
      loadFaces();
      changeMode();
      startAutoRecognition();
    } catch (e) {
      statusBox.className = "status-msg bg-danger text-white";
      statusBox.innerText = "❌ الكاميرا لا تعمل: " + e.message;
    }
  }

  function changeMode() {
    const m = document.querySelector('input[name="mode"]:checked').value;
    document.getElementById('topicDiv').classList.toggle('d-none', m === 'Register');
    document.getElementById('registerDiv').classList.toggle('d-none', m !== 'Register');
    if (m !== 'Register') updateTopics(m);
  }

  function updateTopics(mode) {
    fetch(`${API_URL}?action=getTopics&mode=${mode}`)
      .then(r => r.json())
      .then(list => {
        let s = document.getElementById('topicSelect'); s.innerHTML = '';
        list.forEach(t => { if(t) s.innerHTML += `<option value="${t}">${t}</option>`; });
      });
  }

  function loadFaces() {
    fetch(`${API_URL}?action=getFaces`)
      .then(r => r.json())
      .then(data => {
        labeledDescriptors = data.map(w => new faceapi.LabeledFaceDescriptors(w.id.toString(), [new Float32Array(w.descriptor)]));
      });
  }

  // دالة التحقق من العامل
  function verifyWorker() {
    const id = document.getElementById('workerId').value;
    if(!id) return alert("الرجاء كتابة رقم التعريف (ID) أولاً!");
    
    statusBox.className = "status-msg bg-info text-white";
    statusBox.innerText = "🔍 جاري البحث عن بيانات العامل...";
    
    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "checkWorker", workerId: id })
    }).then(r => r.json()).then(res => {
      if(res.found) {
        document.getElementById('workerNameLabel').innerText = `✅ ${res.name} (${res.job})`;
        document.getElementById('saveFaceBtn').disabled = false;
        currentVerifiedId = res.id;
        statusBox.className = "status-msg bg-success text-white";
        statusBox.innerText = "وجه الكاميرا للعامل واضغط حفظ البصمة";
      } else {
        document.getElementById('workerNameLabel').innerText = "❌ الرقم غير موجود في شيت Data!";
        document.getElementById('saveFaceBtn').disabled = true;
        currentVerifiedId = null;
        statusBox.className = "status-msg bg-danger text-white";
        statusBox.innerText = "تأكد من كتابة الرقم بشكل صحيح";
      }
    });
  }

  async function startAutoRecognition() {
    const displaySize = { width: video.videoWidth, height: video.videoHeight };
    faceapi.matchDimensions(canvas, displaySize);

    setInterval(async () => {
      if (isProcessing || !modelsLoaded) return;

      const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks(true).withFaceDescriptors();
      const resizedDetections = faceapi.resizeResults(detections, displaySize);
      
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      faceapi.draw.drawDetections(canvas, resizedDetections);

      const mode = document.querySelector('input[name="mode"]:checked').value;
      if (mode !== 'Register' && labeledDescriptors.length > 0) {
        const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55);
        resizedDetections.forEach(d => {
          const match = faceMatcher.findBestMatch(d.descriptor);
          if (match.label !== 'unknown') {
            autoRecord(match.label);
          }
        });
      }
    }, 500);
  }

  function autoRecord(workerId) {
    isProcessing = true;
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const topic = document.getElementById('topicSelect').value;
    
    statusBox.className = "status-msg bg-info text-white";
    statusBox.innerText = "🎯 جاري تسجيل حضور ID: " + workerId;

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "record", sheetName: mode, workerId: workerId, topicName: topic })
    }).then(r => r.json()).then(res => {
      if(res.success) {
        statusBox.className = "status-msg bg-success text-white";
        statusBox.innerText = `✅ تم تسجيل حضور: ${res.workerName}`;
      } else {
        statusBox.className = "status-msg bg-danger text-white";
        statusBox.innerText = `❌ ${res.message}`;
      }
      setTimeout(() => { isProcessing = false; }, 3000);
    });
  }

  async function saveNewFace() {
    if(!currentVerifiedId) return alert("قم بالتحقق من العامل أولاً!");
    
    statusBox.innerText = "📸 جاري التقاط البصمة...";
    const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks(true).withFaceDescriptor();

    if(!detection) return alert("لم يتم اكتشاف وجه بوضوح! اقترب من الكاميرا.");

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "register", workerId: currentVerifiedId, descriptor: Array.from(detection.descriptor) })
    }).then(r => r.json()).then(res => {
      alert(res.message);
      document.getElementById('workerId').value = "";
      document.getElementById('workerNameLabel').innerText = "";
      document.getElementById('saveFaceBtn').disabled = true;
      currentVerifiedId = null;
      loadFaces(); // تحديث البصمات في الخلفية
    });
  }

  init();
</script>
</body>
</html>
